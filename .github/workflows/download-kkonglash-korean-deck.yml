name: Inspect KKONGLASH Korean Deck Redirect

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/download-kkonglash-korean-deck.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect official Korean deck redirect
        shell: bash
        run: |
          set -u
          url='https://link.inpock.co.kr/api/r/-T4bfLKjLbKM1dMq6rKZ3agM5vU5E9OQzVJtIst05l3BRVN4KbbeXnphkB2Z-4p9vOGjYaENA76Uv6vg3X4WTAMq8clwSfPBt_tbwlylisSrDkappBZVWjkFPkC7XK2_RG3APONznZXQdams6OO0gIZTaeco2I0ir_i4nPPinYihwnpLZzLFE8V5rIyC5EaME0Nl1VLalEtPPF62qFJl7DRo0g45TXATtz_-cSg'
          curl -sS -L --connect-timeout 30 --max-time 300 -D headers.txt \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151.0.0.0 Safari/537.36' \
            -w '%{url_effective}\n%{http_code}\n%{content_type}\n' \
            -o downloaded.bin "$url" | tee effective.txt
          file downloaded.bin | tee filetype.txt
          head -c 500 downloaded.bin | strings | tee head.txt || true
          python3 - <<'PY'
          import pathlib,re,html
          b=pathlib.Path('downloaded.bin').read_bytes()
          s=b.decode('utf-8',errors='ignore')
          urls=[]
          for u in re.findall(r'https?://[^"\'<>\\ ]+', html.unescape(s)):
              if u not in urls: urls.append(u)
          pathlib.Path('urls.txt').write_text('\n'.join(urls[:300]),encoding='utf-8')
          print('\n'.join(urls[:100]))
          PY
      - name: Upload inspection
        uses: actions/upload-artifact@v4
        with:
          name: kkonglash-korean-deck-redirect-inspection
          path: |
            headers.txt
            effective.txt
            filetype.txt
            head.txt
            urls.txt
            downloaded.bin
          retention-days: 3
